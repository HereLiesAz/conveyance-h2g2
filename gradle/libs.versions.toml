[versions]
agp = "9.5.1"
gradle = "9.7.1"
kotlin = "2.4.21"
compose = "1.12.2"
compileSdk = "37"
compileSdkMinor = "1"
minSdk = "24"
jvmToolchain = "21"
# The Conveyance release this builds against (JitPack tag). A floating main-SNAPSHOT makes KMP metadata
# non-reproducible and can resolve stale per-target publications through JitPack, so it is a tag, and
# Dependabot proposes the next one. The Aive reads this value (its build.gradle.kts).
conveyance = "0.5.0"

[libraries]
conveyance-core = { module = "com.github.HereLiesAz.Conveyance:conveyance-core", version.ref = "conveyance" }
conveyance-compose = { module = "com.github.HereLiesAz.Conveyance:conveyance-compose", version.ref = "conveyance" }

[plugins]
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
