[versions]
# Android Gradle plugin used to build the published Android variant.
agp = "9.5.1"
gradle = "9.7.1"
kotlin = "2.4.21"
compose = "1.12.2"
compileSdk = "37"
compileSdkMinor = "1"
minSdk = "24"
jvmToolchain = "21"
# Published Conveyance multiplatform release; all targets use the same version.
conveyance = "0.5.0"

[libraries]
conveyance-core = { module = "com.hereliesaz.conveyance:conveyance-core", version.ref = "conveyance" }
conveyance-compose = { module = "com.hereliesaz.conveyance:conveyance-compose", version.ref = "conveyance" }

[plugins]
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
