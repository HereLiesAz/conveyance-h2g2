name: Import Azrienoch 1.2 assets
on:
  push:
    branches: ['fix/azrienoch-1-2-assets']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix/azrienoch-1-2-assets'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify the published font
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/Azrienoch-VF.ttf" 'https://github.com/HereLiesAz/azrienoch/releases/download/1.2/Azrienoch-VF.ttf'
          printf '%s  %s\n' '1932c8156fb65aee5c0ca05cb229ec78ee4f487240034c84595b359fdb8f46b4' "$RUNNER_TEMP/Azrienoch-VF.ttf" | sha256sum --check
          python -m pip install --disable-pip-version-check 'fonttools==4.63.0'
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont
          from pathlib import Path
          import os
          source = Path(os.environ["RUNNER_TEMP"]) / "Azrienoch-VF.ttf"
          target = Path("src/commonMain/composeResources/font")
          for name, weight, width in [
              ("regular", 400, 100), ("semibold", 600, 100),
              ("extrabold", 800, 100), ("black", 900, 100),
              ("mono_regular", 400, 0), ("mono_bold", 800, 0),
          ]:
              with TTFont(source, recalcTimestamp=False) as variable:
                  assert {a.axisTag for a in variable["fvar"].axes} == {"wght", "wdth", "SERF", "GRAD"}
                  static = instantiateVariableFont(variable, {"wght": weight, "wdth": width, "SERF": 0, "GRAD": 0}, inplace=True, updateFontNames=True)
                  assert "fvar" not in static
                  assert static["OS/2"].usWeightClass == weight
                  if width == 0:
                      cmap = static.getBestCmap()
                      assert len({static["hmtx"][cmap[c]][0] for c in range(32, 127)}) == 1
                  static.save(target / ("azrienoch_" + name + ".ttf"))
          PY
          git add -- 'src/commonMain/composeResources/font/azrienoch_regular.ttf' 'src/commonMain/composeResources/font/azrienoch_semibold.ttf' 'src/commonMain/composeResources/font/azrienoch_extrabold.ttf' 'src/commonMain/composeResources/font/azrienoch_black.ttf' 'src/commonMain/composeResources/font/azrienoch_mono_regular.ttf' 'src/commonMain/composeResources/font/azrienoch_mono_bold.ttf'
          git diff --cached --stat
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Vendor Azrienoch 1.2.0 font assets'
          git push origin HEAD:refs/heads/fix/azrienoch-1-2-assets
