name: Publish multiplatform library
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable Maven release version (major.minor.patch)
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Test and publish all library targets
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew desktopTest -PpublicationVersion="$RELEASE_VERSION"
          ./gradlew publishAllPublicationsToGitHubPackagesRepository -PpublicationVersion="$RELEASE_VERSION"
